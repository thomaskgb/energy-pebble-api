name: tests

# Runs on GitHub-hosted runners (not the cumulus deploy runner). Gates PRs into
# main once branch protection requires the `signing-tests` check.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  signing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Firmware signing unit tests
        run: python tests/test_firmware_signing.py
      - name: Firmware upload + OTA signing integration tests
        run: python tests/test_firmware_upload_signing.py

  # Guards the interface translations: catches a string added to a page without
  # a matching nl/fr entry (which would silently render in English), a key used
  # but never translated, and the script-order dependency the web components
  # rely on.
  i18n-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Interface language tests
        run: pytest tests/test_i18n.py -q
        env:
          ENERGY_PEBBLE_DATA_DIR: ${{ runner.temp }}

  # Builds the actual Docker image and boots it, so image-level breakage (a file
  # main.py imports but the Dockerfile forgot to COPY, a missing dependency, an
  # import error at startup) fails CI instead of reaching prod (where only the
  # deploy health-check + rollback would catch it).
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t energy-pebble-api:ci .
      - name: Run container
        run: docker run -d --name ep-smoke -p 8000:8000 energy-pebble-api:ci
      - name: Smoke test /api/sample
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/api/sample >/dev/null; then
              echo "container healthy"
              exit 0
            fi
            sleep 3
          done
          echo "::error::container never served /api/sample"
          docker logs ep-smoke
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f ep-smoke || true
