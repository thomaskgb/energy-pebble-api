name: Deploy to cumulus

# Runs when a PR is merged (i.e. a push lands on main) or on manual dispatch.
# Executes on the self-hosted runner installed on cumulus, which connects
# outbound to GitHub — no inbound ports and no SSH key stored in GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys overlap; a newer merge supersedes an in-flight deploy.
concurrency:
  group: deploy-cumulus
  cancel-in-progress: false

jobs:
  deploy:
    # The runner on cumulus must be registered with these labels.
    runs-on: [self-hosted, cumulus]
    permissions:
      contents: read
    steps:
      - name: Check out the deploy script
        uses: actions/checkout@v4

      - name: Deploy
        env:
          # Absolute path to the LIVE production checkout on cumulus (the one the
          # docker compose stack runs from — NOT this runner workspace).
          # Override in the repo under Settings → Secrets and variables →
          # Actions → Variables → DEPLOY_DIR if the path differs.
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/cumulus/github/energy-pebble-api' }}
          DEPLOY_BRANCH: main
        run: ./deploy/deploy.sh
