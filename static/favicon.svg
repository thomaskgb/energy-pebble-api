<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Energy Pebble">
  <!-- The pebble as it looks lit: a dark body, the green/yellow/red hour ring,
       and the "now" dot in the middle. The body is dark rather than the
       device's cream so the ring keeps its contrast at 16px on both a light
       and a dark browser tab strip. Geometry is tuned for the 16px grid -
       fat arcs, tight gaps, a light centre that stays a distinct dot. -->
  <rect x=".5" y=".5" width="31" height="31" rx="9.5" fill="#171c24"/>
  <path d="M16.76 3.62A12.4 12.4 0 0 1 27.10 21.53L22.26 19.12A7.0 7.0 0 0 0 16.43 9.01Z" fill="#3ddc78"/>
  <path d="M26.34 22.84A12.4 12.4 0 0 1 5.66 22.84L10.16 19.86A7.0 7.0 0 0 0 21.84 19.86Z" fill="#f5a623"/>
  <path d="M4.90 21.53A12.4 12.4 0 0 1 15.24 3.62L15.57 9.01A7.0 7.0 0 0 0 9.74 19.12Z" fill="#f0426b"/>
  <circle cx="16" cy="16" r="3.8" fill="#f7f4ef"/>
</svg>
