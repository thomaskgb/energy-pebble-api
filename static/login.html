<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1319" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title data-i18n="login.pageTitle">Energy Pebble - Login</title>
    <link rel="stylesheet" href="base.css?v=2026-08-30-6">
    <style>
        /* Page-specific layout only; everything reusable lives in base.css. */

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-6);
        }

        .login {
            width: 100%;
            max-width: 380px;
        }

        .login__brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            font-size: var(--text-2xl);
            font-weight: var(--weight-semibold);
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .login__brand [data-icon] { color: var(--accent); }

        .login__subtitle {
            margin-top: var(--space-2);
            text-align: center;
            color: var(--text-secondary);
        }

        .login__card {
            margin-top: var(--space-6);
            padding: var(--space-8);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
        }

        .login__form { display: flex; flex-direction: column; gap: var(--space-5); }

        .login__back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            margin-top: var(--space-6);
            font-size: var(--text-base);
            font-weight: var(--weight-medium);
        }

        /* Inline feedback, shown by showMessage() */
        .message { display: none; }
        .message.is-visible { display: flex; }
    </style>
</head>
<body>
    <main class="login">
        <div class="login__brand">
            <i data-icon="bolt" data-icon-size="24"></i>
            Energy Pebble
        </div>
        <p class="login__subtitle" data-i18n="login.subtitle">Sign in to your account</p>

        <div class="login__card">
            <div id="message" class="notice message" role="status" aria-live="polite"></div>

            <form id="loginForm" class="login__form">
                <div class="field">
                    <label class="field__label" for="username" data-i18n="login.username">Username</label>
                    <input class="input" type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="field">
                    <label class="field__label" for="password" data-i18n="login.password">Password</label>
                    <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn--primary btn--lg btn--block" id="login-submit">
                    <span id="login-submit-label" data-i18n="login.submit">Sign in</span>
                </button>
            </form>
        </div>

        <a href="/" class="login__back">
            <i data-icon="arrowLeft" data-icon-size="15"></i>
            <span data-i18n="login.back">Back to Energy Pebble</span>
        </a>
    </main>

    <script src="i18n-strings.js?v=2026-08-30-6"></script>
    <script src="i18n.js?v=2026-08-30-6"></script>
    <script src="icons.js?v=2026-08-30-6"></script>
    <script>
        // No account is signed in yet, so the account language cannot apply:
        // the browser language or a previous choice decides.
        I18n.start({ sync: false });
        const t = (key, vars) => I18n.t(key, vars);

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showMessage(t('login.error.missingFields'), 'error');
                return;
            }

            // Show loading state. Only the label changes, so the button keeps
            // whatever markup it carries.
            const submitBtn = document.getElementById('login-submit');
            const label = document.getElementById('login-submit-label');
            const originalText = label.textContent;
            submitBtn.disabled = true;
            label.textContent = t('login.pending');

            try {
                // First, authenticate with Authelia
                const response = await fetch('https://auth.tdlx.nl/api/firstfactor', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        keepMeLoggedIn: false
                    })
                });

                if (response.ok) {
                    showMessage(t('login.success'), 'success');
                    // Redirect to dashboard after successful login
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    const error = await response.json();
                    showMessage(error.message || t('login.error.invalid'), 'error');
                }
            } catch (error) {
                showMessage(t('login.error.generic'), 'error');
            } finally {
                submitBtn.disabled = false;
                label.textContent = originalText;
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML =
                Icons.svg(type === 'error' ? 'alert' : 'checkCircle', { size: 16 }) +
                '<span></span>';
            messageDiv.querySelector('span').textContent = text;
            messageDiv.className =
                'notice message is-visible ' + (type === 'error' ? 'notice--danger' : 'notice--accent');
            messageDiv.style.marginBottom = 'var(--space-5)';

            // Hide message after 5 seconds
            setTimeout(() => {
                messageDiv.className = 'notice message';
            }, 5000);
        }
    </script>
</body>
</html>
