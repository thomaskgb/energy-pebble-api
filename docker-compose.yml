# Energy Pebble application stack.
#
# The reverse proxy (Traefik) and SSO (Authelia) are NOT here -- they are
# server-wide infrastructure living in ../cumulus/edge. Bring that stack up
# first; this one joins its external `proxy` network.
#
# TLS: the websecure entrypoint sets certResolver=letsencrypt by default, so
# individual routers do not repeat it.
#
# Auth is opt-in per router: a route without `authelia@file` is public. Any
# route that devices call must stay public -- ESPHome firmware holds no session
# and cannot follow a login redirect.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      # Ed25519 firmware-signing PUBLIC key (safe to commit). Turns on signature
      # verification for /api/firmware/upload; without it the server stays in
      # checksum-only fallback. Must match the key embedded in firmware and the
      # esphome FIRMWARE_SIGNING_KEY private-key signing secret.
      - FIRMWARE_SIGNING_PUBKEY=f4f071b29d6fd6f76213228b0faac5f9d0eec1d09411e8ef16300e3eae788e8a
    volumes:
      - ./data:/tmp
      - ./firmware:/home/cumulus/github/energy_pebble/firmware
      # /api/admin/users/management reads the Authelia user list (main.py:2797).
      # Path is relative to this compose file.
      - ../cumulus/edge/authelia/config:/app/authelia/config:ro
    labels:
      - "traefik.enable=true"

      # ---- Protected API (browser session required) --------------------
      # Listed positively rather than as "all of /api/firmware except
      # upload": the blanket prefix used to swallow the device-facing
      # /api/firmware/latest-stable and /api/firmware/<file>/checksum
      # endpoints and redirect them to the login page.
      - "traefik.http.routers.energypebble-api-auth.rule=Host(`energypebble.tdlx.nl`) && (PathPrefix(`/api/user`) || PathPrefix(`/api/verify`) || PathPrefix(`/api/admin`) || PathPrefix(`/api/firmware/versions`) || PathPrefix(`/api/firmware/ota-stats`))"
      - "traefik.http.routers.energypebble-api-auth.entrypoints=websecure"
      - "traefik.http.routers.energypebble-api-auth.priority=15"
      - "traefik.http.routers.energypebble-api-auth.middlewares=authelia@file,real-ip@file"
      - "traefik.http.routers.energypebble-api-auth.service=energypebble-api"

      # ---- Local-development test endpoints: blocked at the edge -------
      # /api/test/user/* take a ?user= parameter and perform no auth check
      # of their own, so they must never be reachable from the internet.
      - "traefik.http.routers.energypebble-api-test.rule=Host(`energypebble.tdlx.nl`) && PathPrefix(`/api/test`)"
      - "traefik.http.routers.energypebble-api-test.entrypoints=websecure"
      - "traefik.http.routers.energypebble-api-test.priority=20"
      - "traefik.http.routers.energypebble-api-test.middlewares=block-internal@file"
      - "traefik.http.routers.energypebble-api-test.service=energypebble-api"

      # ---- Firmware upload (CI) ---------------------------------------
      # Bypasses Authelia so GitHub Actions can use a Bearer token; the
      # handler enforces admin privileges itself (main.py:1790).
      - "traefik.http.routers.energypebble-firmware-upload.rule=Host(`energypebble.tdlx.nl`) && Path(`/api/firmware/upload`)"
      - "traefik.http.routers.energypebble-firmware-upload.entrypoints=websecure"
      - "traefik.http.routers.energypebble-firmware-upload.priority=16"
      - "traefik.http.routers.energypebble-firmware-upload.middlewares=real-ip@file"
      - "traefik.http.routers.energypebble-firmware-upload.service=energypebble-api"

      # ---- Firmware binary download (devices) -------------------------
      - "traefik.http.routers.energypebble-firmware.rule=Host(`energypebble.tdlx.nl`) && PathPrefix(`/firmware`)"
      - "traefik.http.routers.energypebble-firmware.entrypoints=websecure"
      - "traefik.http.routers.energypebble-firmware.priority=12"
      - "traefik.http.routers.energypebble-firmware.middlewares=real-ip@file"
      - "traefik.http.routers.energypebble-firmware.service=energypebble-api"

      # ---- Docs / OpenAPI ---------------------------------------------
      - "traefik.http.routers.energypebble-docs.rule=Host(`energypebble.tdlx.nl`) && (PathPrefix(`/docs`) || Path(`/openapi.json`))"
      - "traefik.http.routers.energypebble-docs.entrypoints=websecure"
      - "traefik.http.routers.energypebble-docs.priority=10"
      - "traefik.http.routers.energypebble-docs.service=energypebble-api"

      # ---- Public API: colour codes, OTA check/status, samples --------
      - "traefik.http.routers.energypebble-api.rule=Host(`energypebble.tdlx.nl`) && PathPrefix(`/api`)"
      - "traefik.http.routers.energypebble-api.entrypoints=websecure"
      - "traefik.http.routers.energypebble-api.priority=5"
      - "traefik.http.routers.energypebble-api.middlewares=real-ip@file"
      - "traefik.http.routers.energypebble-api.service=energypebble-api"

      - "traefik.http.services.energypebble-api.loadbalancer.server.port=8000"
    networks:
      - proxy

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./static:/usr/share/caddy
    labels:
      - "traefik.enable=true"

      # ---- Admin area: admins only (enforced in Authelia) -------------
      - "traefik.http.routers.energypebble-web-admin.rule=Host(`energypebble.tdlx.nl`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.energypebble-web-admin.entrypoints=websecure"
      - "traefik.http.routers.energypebble-web-admin.priority=11"
      - "traefik.http.routers.energypebble-web-admin.middlewares=authelia@file,security-headers@file"
      - "traefik.http.routers.energypebble-web-admin.service=energypebble-web"

      # ---- Signed-in areas -------------------------------------------
      - "traefik.http.routers.energypebble-web-auth.rule=Host(`energypebble.tdlx.nl`) && (PathPrefix(`/dashboard`) || PathPrefix(`/impact-circle`))"
      - "traefik.http.routers.energypebble-web-auth.entrypoints=websecure"
      - "traefik.http.routers.energypebble-web-auth.priority=10"
      - "traefik.http.routers.energypebble-web-auth.middlewares=authelia@file,security-headers@file"
      - "traefik.http.routers.energypebble-web-auth.service=energypebble-web"

      # ---- Public site -----------------------------------------------
      - "traefik.http.routers.energypebble-web.rule=Host(`energypebble.tdlx.nl`)"
      - "traefik.http.routers.energypebble-web.entrypoints=websecure"
      - "traefik.http.routers.energypebble-web.priority=1"
      - "traefik.http.routers.energypebble-web.middlewares=security-headers@file"
      - "traefik.http.routers.energypebble-web.service=energypebble-web"

      - "traefik.http.services.energypebble-web.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
